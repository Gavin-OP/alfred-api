      - 领域文档: agents/domain.md
      - Issue 追踪: agents/issue-tracker.md
      - 分层标签: agents/triage-labels.md
  - 可视化 (HTML):
      - 上传工作流图: diagrams/workflow.html
      - 首页原型: diagrams/index.html
      - 变更日志图: diagrams/changelog.html
  - 历史基线 v0.1 (已作废):
