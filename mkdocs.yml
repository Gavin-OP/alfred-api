site_name: Alfred · 产品设计文档
site_description: Alfred 个人 AI 求职助理 — 产品需求、数据模型与架构决策文档站
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - 首页: index.md
  - 最新更新 (Latest):
      - 最近更新索引: LATEST.md
  - 产品愿景 (VISION):
      - VISION: VISION.md
  - 产品需求 PRD:
      - 分区说明与索引: prd/README.md
      - 求职助理用户流程: prd/job-seeking.md
  - 设计文档 (Design):
      - 数据模型 V2: DATA_MODEL_V2.md
      - 引擎规范 (GRAPH): GRAPH.md
      - 捕获与分发工作流: UPLOAD_WORKFLOW.md
      - 重新设计会话 2026-08-03: design-sessions/2026-08-03-v1-redesign.md
  - 参考 (Reference):
      - 术语表 (GLOSSARY): GLOSSARY.md
      - 变更记录 (CHANGELOG): CHANGELOG.md
  - 架构决策 ADR:
      - 索引: adr/README.md
      - "ADR-0001 PostgreSQL": adr/0001-postgresql-over-sqlite.md
      - "ADR-0002 双仓库": adr/0002-two-repositories.md
      - "ADR-0003 Taro 三端": adr/0003-taro-react-tri-platform.md
      - "ADR-0004 可脚本化技能目录": adr/0004-scriptable-skill-directories.md
      - "ADR-0005 长输入分块": adr/0005-chunked-pipeline-for-long-input.md
      - "ADR-0006 推迟 LaTeX 编译": adr/0006-defer-latex-pdf-compilation.md
      - "ADR-0007 命名 Alfred": adr/0007-naming-alfred.md
      - "ADR-0008 services 唯一落库": adr/0008-services-as-single-write-path.md
      - "ADR-0009 命名 job_posting/occupation": adr/0009-naming-job-posting-occupation.md
      - "ADR-0010 Event/Fact 双真相": adr/0010-event-fact-dual-truth.md
      - "ADR-0011 多用户边界": adr/0011-multi-tenant-boundary.md
      - "ADR-0012 编排 LangGraph": adr/0012-orchestration-langgraph.md
      - "ADR-0013 上下文分段": adr/0013-context-segments.md
      - "ADR-0014 简历溯源": adr/0014-resume-provenance.md
      - "ADR-0015 Location 实体": adr/0015-location-entity.md
      - "ADR-0016 领域无关内核": adr/0016-domain-agnostic-kernel.md
      - "ADR-0017 Organization 泛化": adr/0017-organization-generalization.md
      - "ADR-0018 引擎术语 Node/Graph/Action": adr/0018-engine-terminology-node-graph-action.md
      - "ADR-0019 图即 Python": adr/0019-graph-as-python.md
      - "ADR-0020 四层分发": adr/0020-four-layer-dispatch.md
      - "ADR-0021 领域图包": adr/0021-domain-graph-packages.md
      - "ADR-0022 文档治理 PRD/Design/ADR": adr/0022-documentation-taxonomy-prd-design-adr.md
      - "ADR-0023 图表归档位置": adr/0023-diagram-placement.md
  - 协作与贡献 (Contributing):
